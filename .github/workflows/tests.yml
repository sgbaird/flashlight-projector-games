name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pyyaml pytest
      - run: python -m pytest -q
      - run: python -m py_compile flashlight_scripture_maze/*.py scooby_doo_pac_man/*.py

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -c "import cv2, pygame"
      - run: python -m pytest -q
      - run: python -m py_compile flashlight_scripture_maze/*.py scooby_doo_pac_man/*.py
